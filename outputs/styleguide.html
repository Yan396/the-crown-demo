<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王冠 · 战斗舞台样板间</title>
<link rel="stylesheet" href="css/ui.css">
<style>
  /* Dev harness only — never shipped into the game screens. */
  body { background: var(--lacquer); margin: 0; font-family: var(--font-body); color: var(--paper-on-lacquer); }
  .bench {
    position: fixed; z-index: 50; top: 10px; left: 50%; translate: -50%;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw;
  }
  .bench button {
    min-height: 40px; padding: 8px 14px; border: 1px solid var(--rule-on-lacquer);
    border-radius: 2px; background: transparent; color: var(--paper-on-lacquer);
    font: 500 13px var(--font-body);
  }
  #verdict {
    position: fixed; z-index: 50; bottom: 10px; left: 50%; translate: -50%;
    color: var(--paper-on-lacquer); font: 12px/1.6 ui-monospace, monospace;
    white-space: pre; text-align: center; pointer-events: none;
  }
  .clips { max-width: 1100px; margin: 78px auto 40px; padding: 0 16px 40px; }
  .clips h1 { font: 600 20px var(--font-display); letter-spacing: .1em; }
  .clips p { font-size: 13px; line-height: 1.7; opacity: .82; }
  .clip-grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .clip figure { margin: 0; }
  .clip video { width: 100%; background: #000; border: 1px solid var(--rule-on-lacquer); }
  .clip figcaption { margin-top: 6px; font-size: 12px; line-height: 1.6; opacity: .8; }
  .clip b { display: block; font: 600 13px var(--font-display); letter-spacing: .06em; opacity: 1; }
</style>
</head>
<body>
<div class="bench">
  <button data-play="field">野战 · 15s 标准</button>
  <button data-play="archers">弓箭 close</button>
  <button data-play="archerKill">弓箭命中</button>
  <button data-play="cavalry">骑兵冲击</button>
  <button data-play="town">守城齐射</button>
  <button data-play="officers">部将</button>
  <button data-play="flank">侧击转身</button>
  <button id="check-skip">跳过一致性校验</button>
</div>
<code id="verdict"></code>

<section class="clips">
  <h1>战斗表现 · 实机录像</h1>
  <p>
    以下四段均为 Chromium 实机录制（1× 播放，390×844），由
    <code>work/record_stage.mjs</code> 驱动本页的确定性脚本产出，非静态截图拼接。
    Recorded from this page's own deterministic fixtures at 1× speed.
  </p>
  <div class="clip-grid">
    <figure class="clip">
      <video src="clips/field-15s.webm" controls muted loop playsinline preload="metadata"></video>
      <figcaption>
        <b>(a) 15s 中型野战 · promo standard</b>
        16 tokens、枪弓骑混编、战前阵型承诺、两次镜头震动（接敌 + 最后一击）。
      </figcaption>
    </figure>
    <figure class="clip">
      <video src="clips/archer-volley.webm" controls muted loop playsinline preload="metadata"></video>
      <figcaption>
        <b>(b) 弓箭 close sequence</b>
        搭箭 100ms → 满弓保持 200ms → 撒放 60ms → 复位；每箭为真实抛物线，10% 齐射箭矢落空插地。
      </figcaption>
    </figure>
    <figure class="clip">
      <video src="clips/cavalry-charge.webm" controls muted loop playsinline preload="metadata"></video>
      <figcaption>
        <b>(c) 骑兵冲击入接敌</b>
        2.2× 推进距离、提前 300ms 接敌、HEAVY 档 200ms 预备 / 130ms 定格 / 16px 击退，冲阵后停在阵线之前。
      </figcaption>
    </figure>
    <figure class="clip">
      <video src="clips/archer-kill.webm" controls muted loop playsinline preload="metadata"></video>
      <figcaption>
        <b>(d) 弓箭命中完整拍</b>
        搭箭、飞行、命中拍移除箭矢、目标击退、方向墨溅、伤害数字与死亡定格连续完成。
      </figcaption>
    </figure>
  </div>
</section>

<script type="module">
import { createBattleStage } from "./js/battle-stage.js";
import { CONFIG_PRESENTATION as P } from "./js/presentation.js";
import { STRINGS } from "./js/strings.js";

/*
 * Deterministic fixtures in the CURRENT battleScript contract:
 *   { battleId, terrain, sides: { player, enemy }, events: [{ t, type, ... }] }
 * They are hand-written rather than engine-produced so the harness has no
 * dependency on a save, but every field is one the engine really emits, and
 * nothing here is read by the game.
 */
function side(label, n, arms) {
  return {
    label,
    startTroops: n,
    tokens: Array.from({ length: n }, (_, i) => ({
      idx: i,
      troopType: arms[i % arms.length].type,
      arm: arms[i % arms.length].arm
    }))
  };
}

const SPEAR = { type: "militia", arm: "spear" };
const VET = { type: "veteran", arm: "spear" };
const BOW = { type: "militia", arm: "archer" };
const HORSE = { type: "veteran", arm: "cavalry" };
const FOE = { type: "bandit", arm: "spear" };

function mockScript({
  terrain = "field", playerArms = [SPEAR, VET, BOW, HORSE], enemyArms = [FOE],
  n = 16, rounds = 4, officers = null, volley = 0
} = {}) {
  const events = [{ t: 0, type: "battle_start" }];
  if (volley) {
    events.push(terrain === "town"
      ? { t: 40, type: "volley", side: "defender", arrows: volley }
      : { t: 40, type: "archer_volley", side: "player", arrows: volley });
  }
  let t = 100;
  let playerLeft = n;
  let enemyLeft = n;
  for (let r = 0; r < rounds; r += 1) {
    events.push({ t, type: "round_start", n: r + 1 });
    for (let beat = 0; beat < 3; beat += 1) {
      t += 10;
      const killEnemy = enemyLeft > 3;
      const killPlayer = r > 1 && playerLeft > 6 && beat === 1;
      events.push({
        t, type: "strike", beat,
        from: { side: "player", idx: (r * 3 + beat) % n },
        to: { side: "enemy", idx: (r * 2 + beat) % n },
        kill: killEnemy, dmgShown: 3 + beat, hpAfter: killEnemy ? 0 : 6 - beat
      });
      if (killEnemy) enemyLeft -= 1;
      events.push({
        t, type: "strike", beat,
        from: { side: "enemy", idx: (r + beat) % n },
        to: { side: "player", idx: (r * 3 + beat + 2) % n },
        kill: killPlayer, dmgShown: 2 + beat, hpAfter: killPlayer ? 0 : 7 - beat
      });
      if (killPlayer) playerLeft -= 1;
    }
    if (r === rounds - 2) events.push({ t: t + 5, type: "morale", side: "enemy", level: "wavering" });
    t += 30;
  }
  events.push({ t: t + 5, type: "rout", side: "enemy" });
  events.push({
    t: t + 40, type: "battle_end", winner: "player",
    loot: { gold: 46, renown: 3 },
    survivors: { player: playerLeft, enemy: enemyLeft }
  });
  const script = {
    battleId: `sg-${terrain}-${n}-${rounds}`,
    terrain,
    sides: { player: side("我军", n, playerArms), enemy: side("匪队", n, enemyArms) },
    events,
    formations: { player: "line", enemy: "wedge" },
    // Kept as a dormant engine field for compatibility. The stage deliberately
    // ignores it: formation is the only player decision around a battle.
    command: "hold"
  };
  if (officers) {
    script.lieutenant = "player";
    script.lieutenantIds = officers;
  }
  return script;
}

/* The recorded fixtures, named so the recorder can ask for them by key. */
const FIXTURES = {
  field: () => mockScript({
    n: 16, rounds: 3, volley: 4,
    officers: ["chen_mang", "shen_wen"]
  }),
  archers: () => mockScript({
    n: 8, rounds: 3, volley: 5,
    playerArms: [BOW], enemyArms: [FOE]
  }),
  archerKill: () => ({
    battleId: "sg-archer-kill",
    terrain: "field",
    // One rear-rank archer protected by a melee screen, so the recording shows
    // a legal shot rather than an already-overrun bow line.
    sides: { player: side("我军", 4, [SPEAR, SPEAR, BOW, SPEAR]), enemy: side("匪队", 4, [FOE]) },
    events: [
      { t: 0, type: "battle_start" },
      { t: 100, type: "round_start", n: 1 },
      {
        t: 130, type: "strike", beat: 0,
        from: { side: "player", idx: 2 }, to: { side: "enemy", idx: 0 },
        kill: true, dmgShown: 7, hpAfter: 0
      },
      { t: 170, type: "rout", side: "enemy" },
      {
        t: 220, type: "battle_end", winner: "player",
        loot: { gold: 12, renown: 1 }, survivors: { player: 4, enemy: 3 }
      }
    ],
    formations: { player: "line", enemy: "line" },
    command: "hold"
  }),
  cavalry: () => mockScript({
    n: 10, rounds: 3,
    playerArms: [HORSE, HORSE, SPEAR], enemyArms: [FOE]
  }),
  town: () => mockScript({ terrain: "town", n: 12, rounds: 3, volley: 6 }),
  officers: () => mockScript({
    n: 9, rounds: 3, officers: ["chen_mang", "shen_wen", "jia_duojin"]
  }),
  flank: () => ({
    battleId: "sg-facing-flank",
    terrain: "field",
    sides: { player: side("我军", 6, [SPEAR]), enemy: side("匪队", 6, [FOE]) },
    events: [
      { t: 0, type: "battle_start" },
      { t: 100, type: "round_start", n: 1 },
      {
        t: 130, type: "strike", beat: 0,
        from: { side: "player", idx: 5 }, to: { side: "enemy", idx: 1 },
        kill: false, dmgShown: 4, hpAfter: 5
      },
      {
        t: 220, type: "battle_end", winner: "player",
        loot: { gold: 0, renown: 0 }, survivors: { player: 6, enemy: 6 }
      }
    ],
    formations: { player: "line", enemy: "line" },
    command: "hold"
  })
};

function lookup(key) {
  return key.split(".").reduce((node, part) => (node ? node[part] : undefined), STRINGS.zh);
}

const verdict = document.getElementById("verdict");
let hintShown = true;

const stage = createBattleStage(document.body, {
  translate: (key, params = {}) => {
    const value = lookup(key);
    if (typeof value !== "string") return key;
    return value.replace(/\{(\w+)\}/g, (_, name) => params[name] ?? `{${name}}`);
  },
  hintSeen: () => hintShown,
  persistHint: () => { hintShown = true; },
  onCountSync: (entry) => { window.__SG_COUNTS__.push(entry); },
  onBeat: (beat) => { window.__SG_BEATS__.push(beat); }
});

window.__SG_BEATS__ = [];
window.__SG_COUNTS__ = [];
window.__SG_STAGE__ = stage;
window.__SG_P__ = P;

// One entry point for both the buttons and the recorder.
window.__SG_PLAY__ = (key) => {
  window.__SG_BEATS__ = [];
  window.__SG_COUNTS__ = [];
  const script = (FIXTURES[key] || FIXTURES.field)();
  window.__SG_DONE__ = false;
  stage.play(script, () => { window.__SG_DONE__ = true; });
  return {
    tokens: {
      player: script.sides.player.tokens.length,
      enemy: script.sides.enemy.tokens.length
    }
  };
};

document.querySelectorAll("[data-play]").forEach((button) => {
  button.addEventListener("click", () => {
    window.__SG_PLAY__(button.dataset.play);
    verdict.textContent = `playing ${button.dataset.play}`;
  });
});

/*
 * A skipped battle must settle identically to a watched one. Both projections
 * read the same event array, so the check is: skip immediately, then compare
 * the stage's survivors against battle_end.survivors.
 */
document.getElementById("check-skip").addEventListener("click", async () => {
  const script = FIXTURES.field();
  const expected = script.events.at(-1).survivors;
  window.__SG_PLAY__("field");
  await new Promise((resolve) => setTimeout(resolve, 120));
  stage.skip();
  await new Promise((resolve) => setTimeout(resolve, 60));
  const got = stage.survivors;
  const same = got.player === expected.player && got.enemy === expected.enemy;
  verdict.textContent =
    `skip   => player ${got.player} enemy ${got.enemy}\n` +
    `script => player ${expected.player} enemy ${expected.enemy}\n` +
    (same ? "CONSISTENT" : "MISMATCH");
});
</script>
</body>
</html>
