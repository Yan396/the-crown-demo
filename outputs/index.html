<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1C1916">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body>
  <canvas id="map"></canvas>

  <main id="app-overlay" class="overlay">
    <header id="hud">
      <div class="brand">
        <strong id="brand-title"></strong>
        <small id="brand-subtitle"></small>
      </div>

      <div id="stats" class="stats">
        <div class="stat"><span id="gold-label"></span><strong id="gold-value"></strong></div>
        <div class="stat"><span id="troop-label"></span><strong id="troop-value"></strong></div>
        <div class="stat"><span id="renown-label"></span><strong id="renown-value"></strong></div>
        <div class="stat"><span id="day-label"></span><strong id="day-value"></strong></div>
      </div>

      <div class="hud-actions">
        <button id="pause-button" class="hud-button" type="button"></button>
        <button id="settings-button" class="hud-button" type="button"></button>
      </div>
    </header>

    <div id="hint">
      <span id="hint-dot"></span>
      <span id="hint-text"></span>
    </div>

    <aside id="legend">
      <span id="legend-text"></span>
      <small id="seed-label"></small>
    </aside>

    <section id="report">
      <div class="report-head">
        <strong id="report-title"></strong>
        <button id="skip-battle" type="button" hidden></button>
      </div>
      <ol id="battle-log" aria-live="polite"></ol>
    </section>

    <section id="town-sheet" hidden>
      <div class="town-copy">
        <div id="town-kicker" class="town-kicker"></div>
        <h2 id="town-name"></h2>
        <p id="town-faction"></p>
      </div>
      <button id="recruit-button" type="button">
        <span id="recruit-label"></span>
        <span id="recruit-cost"></span>
      </button>
    </section>

    <button id="settings-scrim" type="button" hidden></button>
    <section id="settings-sheet" hidden>
      <div class="settings-head">
        <h2 id="settings-title"></h2>
        <button id="settings-close" type="button"></button>
      </div>
      <div class="settings-row">
        <span id="language-label" class="settings-label"></span>
        <div class="language-toggle">
          <button id="language-zh" type="button"></button>
          <button id="language-en" type="button"></button>
        </div>
      </div>
      <div class="settings-row">
        <div class="save-copy">
          <span id="autosave-title" class="settings-label"></span>
          <small id="autosave-status"></small>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
