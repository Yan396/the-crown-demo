<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1C1916">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body>
  <canvas id="map"></canvas>

  <main id="app-overlay" class="overlay">
    <header id="hud">
      <div class="brand">
        <strong id="brand-title"></strong>
        <small id="brand-subtitle"></small>
      </div>

      <div id="stats" class="stats">
        <div class="stat">
          <span class="stat-head">
            <!-- Square-holed cash coin, not a generic disc. -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="5.6"/><rect x="6.3" y="6.3" width="3.4" height="3.4"/>
            </svg>
            <span id="gold-label"></span>
          </span>
          <strong id="gold-value"></strong>
        </div>
        <div class="stat">
          <span class="stat-head">
            <!-- Ge-style spear head on a shaft. -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 14.5V6.2"/><path d="M8 1.5 5.9 6.2h4.2z"/><path d="M5.6 9.4h4.8"/>
            </svg>
            <span id="troop-label"></span>
          </span>
          <strong id="troop-value"></strong>
        </div>
        <div class="stat">
          <span class="stat-head">
            <!-- laurel: two facing sprigs -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M5.4 2.9c-2.6 2.5-2.6 7.3 0 10.2"/><path d="M10.6 2.9c2.6 2.5 2.6 7.3 0 10.2"/>
              <path d="M5.4 6.1h1.9M5.4 9.4h1.9M10.6 6.1H8.7M10.6 9.4H8.7"/>
            </svg>
            <span id="renown-label"></span>
          </span>
          <strong id="renown-value"></strong>
        </div>
        <div class="stat">
          <span class="stat-head">
            <!-- sun over the horizon: the passing day -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="3.3"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7"/>
            </svg>
            <span id="day-label"></span>
          </span>
          <strong id="day-value"></strong>
        </div>
      </div>

      <div class="hud-actions">
        <button id="pause-button" class="hud-button" type="button">
          <svg class="glyph glyph-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M6 3.4v9.2M10 3.4v9.2"/>
          </svg>
          <svg class="glyph glyph-resume" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M5.4 3.2 12 8l-6.6 4.8z"/>
          </svg>
        </button>
        <button id="settings-button" class="hud-button" type="button">
          <!-- tuning marks, not a gear: a gear has no place on an ink map -->
          <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M2.4 4.4h11.2M2.4 8h11.2M2.4 11.6h11.2"/>
            <circle cx="5.6" cy="4.4" r="1.5" class="glyph-solid"/>
            <circle cx="10.4" cy="8" r="1.5" class="glyph-solid"/>
            <circle cx="6.8" cy="11.6" r="1.5" class="glyph-solid"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="renown-gate">
      <small id="renown-gate-label"></small>
      <div id="renown-gate-track"><div id="renown-gate-fill"></div></div>
    </div>

    <div id="hint">
      <span id="hint-dot"></span>
      <span id="hint-text"></span>
    </div>

    <aside id="legend">
      <span id="legend-text"></span>
      <small id="seed-label"></small>
    </aside>

    <section id="report">
      <div class="report-head">
        <strong id="report-title"></strong>
        <button id="skip-battle" type="button" hidden></button>
      </div>
      <ol id="battle-log" aria-live="polite"></ol>
    </section>

    <section id="town-sheet" hidden>
      <div class="town-copy">
        <div id="town-kicker" class="town-kicker"></div>
        <h2 id="town-name"></h2>
        <p id="town-faction"></p>
      </div>
      <button id="recruit-button" type="button">
        <span id="recruit-label"></span>
        <span id="recruit-cost"></span>
      </button>
    </section>

    <button id="settings-scrim" type="button" hidden></button>
    <section id="settings-sheet" hidden>
      <div class="settings-head">
        <h2 id="settings-title"></h2>
        <button id="settings-close" type="button">
          <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
      <div class="settings-row">
        <span id="language-label" class="settings-label"></span>
        <div class="language-toggle">
          <button id="language-zh" type="button"></button>
          <button id="language-en" type="button"></button>
        </div>
      </div>
      <div class="settings-row">
        <div class="save-copy">
          <span id="autosave-title" class="settings-label"></span>
          <small id="autosave-status"></small>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
