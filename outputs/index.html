<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1C1916">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="王冠">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='34' fill='%231C1916'/%3E%3Crect x='42' y='42' width='96' height='96' fill='%23B03A2E'/%3E%3Cpath d='M60 111V68l16 16 14-25 14 25 16-16v43z' fill='%23E8DCC3'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='34' fill='%231C1916'/%3E%3Crect x='42' y='42' width='96' height='96' fill='%23B03A2E'/%3E%3Cpath d='M60 111V68l16 16 14-25 14 25 16-16v43z' fill='%23E8DCC3'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="road-event-glyph-animal" viewBox="0 0 24 24">
        <path d="M7 9 4.5 5.5 9 7m8 2 2.5-3.5L15 7M7 9c0-3 2.2-5 5-5s5 2 5 5v4c0 4-2.2 7-5 7s-5-3-5-7z"/>
        <path d="M9.5 12h.1m4.8 0h.1M10 16c1.2.8 2.8.8 4 0"/>
      </symbol>
      <symbol id="road-event-glyph-traveler" viewBox="0 0 24 24">
        <circle cx="12" cy="6" r="3"/><path d="M7 21c.4-6 2-10 5-10s4.6 4 5 10M5 13l4 2m10-2-4 2M12 11v10"/>
      </symbol>
      <symbol id="road-event-glyph-trade" viewBox="0 0 24 24">
        <path d="M12 3v17M6 6h12M8 6l-4 8h8L8 6zm8 0-4 8h8l-4-8zM8 21h8"/>
      </symbol>
      <symbol id="road-event-glyph-village" viewBox="0 0 24 24">
        <path d="m3 11 9-7 9 7M6 9v11h12V9M10 20v-6h4v6M4 20h16"/>
      </symbol>
      <symbol id="road-event-glyph-camp" viewBox="0 0 24 24">
        <path d="M3 20 12 4l9 16H3zm5 0 4-7 4 7M5 8l-2-3m16 3 2-3"/>
      </symbol>
      <symbol id="road-event-glyph-omen" viewBox="0 0 24 24">
        <path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2L12 3z"/><circle cx="12" cy="11" r="1.5"/>
      </symbol>
    </defs>
  </svg>
  <canvas id="map"></canvas>

  <main id="app-overlay" class="overlay">
    <header id="hud">
      <div class="brand">
        <strong id="brand-title"></strong>
        <small id="brand-subtitle"></small>
      </div>

      <div id="stats" class="stats">
        <div class="stat gold-stat">
          <span class="stat-head">
            <!-- Square-holed cash coin, not a generic disc. -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="5.6"/><rect x="6.3" y="6.3" width="3.4" height="3.4"/>
            </svg>
            <span id="gold-label"></span>
          </span>
          <strong id="gold-value"></strong>
          <small id="gold-promise" class="promise-marker" hidden></small>
          <small id="wage-label" class="wage-marker"></small>
        </div>
        <div class="stat troop-stat">
          <span class="stat-head">
            <!-- Ge-style spear head on a shaft. -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 14.5V6.2"/><path d="M8 1.5 5.9 6.2h4.2z"/><path d="M5.6 9.4h4.8"/>
            </svg>
            <span id="troop-label"></span>
          </span>
          <strong id="troop-value"></strong>
          <small id="troop-promise" class="promise-marker" hidden></small>
        </div>
        <div class="stat renown-stat">
          <span class="stat-head">
            <!-- laurel: two facing sprigs -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M5.4 2.9c-2.6 2.5-2.6 7.3 0 10.2"/><path d="M10.6 2.9c2.6 2.5 2.6 7.3 0 10.2"/>
              <path d="M5.4 6.1h1.9M5.4 9.4h1.9M10.6 6.1H8.7M10.6 9.4H8.7"/>
            </svg>
            <span id="renown-label"></span>
          </span>
          <strong id="renown-value"></strong>
        </div>
        <div class="stat day-stat">
          <span class="stat-head">
            <!-- sun over the horizon: the passing day -->
            <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="3.3"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7"/>
            </svg>
            <span id="day-label"></span>
          </span>
          <strong id="day-value"></strong>
        </div>
      </div>

      <div class="hud-actions">
        <button id="pause-button" class="hud-button" type="button">
          <svg class="glyph glyph-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M6 3.4v9.2M10 3.4v9.2"/>
          </svg>
          <svg class="glyph glyph-resume" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M5.4 3.2 12 8l-6.6 4.8z"/>
          </svg>
        </button>
        <button id="settings-button" class="hud-button" type="button">
          <!-- tuning marks, not a gear: a gear has no place on an ink map -->
          <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M2.4 4.4h11.2M2.4 8h11.2M2.4 11.6h11.2"/>
            <circle cx="5.6" cy="4.4" r="1.5" class="glyph-solid"/>
            <circle cx="10.4" cy="8" r="1.5" class="glyph-solid"/>
            <circle cx="6.8" cy="11.6" r="1.5" class="glyph-solid"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="renown-gate">
      <small id="renown-gate-label"></small>
      <div id="renown-gate-track"><div id="renown-gate-fill"></div></div>
    </div>

    <div id="hint">
      <span id="hint-dot"></span>
      <span id="hint-text"></span>
    </div>

    <aside id="legend">
      <span id="legend-text"></span>
      <small id="seed-label"></small>
    </aside>

    <section id="report">
      <div class="report-head">
        <button id="report-toggle" type="button" aria-expanded="false">
          <strong id="report-title"></strong>
          <span id="report-chevron" aria-hidden="true">⌃</span>
        </button>
        <div class="battle-actions">
          <button id="retreat-battle" type="button" hidden></button>
          <button id="skip-battle" type="button" hidden></button>
        </div>
      </div>
      <div id="battle-comparison" hidden>
        <strong id="encounter-verdict"></strong>
        <div class="strength-bars" aria-hidden="true">
          <span><i id="player-strength-bar"></i><small id="player-strength-value"></small></span>
          <span><i id="enemy-strength-bar"></i><small id="enemy-strength-value"></small></span>
        </div>
      </div>
      <ol id="battle-log" aria-live="polite"></ol>
    </section>

    <section id="town-sheet" hidden>
      <div class="town-copy">
        <div id="town-kicker" class="town-kicker"></div>
        <h2 id="town-name"></h2>
        <p id="town-faction"></p>
      </div>
      <div class="town-actions">
        <button id="tavern-button" type="button" hidden>
          <span id="tavern-label"></span>
          <span id="tavern-detail"></span>
        </button>
        <button id="recruit-button" type="button">
          <span id="recruit-label"></span>
          <span id="recruit-cost"></span>
        </button>
      </div>
    </section>

    <button id="settings-scrim" type="button" hidden></button>
    <section id="settings-sheet" hidden>
      <div class="settings-head">
        <h2 id="settings-title"></h2>
        <button id="settings-close" type="button">
          <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
      <div class="settings-row">
        <span id="language-label" class="settings-label"></span>
        <div class="language-toggle">
          <button id="language-zh" type="button"></button>
          <button id="language-en" type="button"></button>
        </div>
      </div>
      <div class="settings-row">
        <div class="save-copy">
          <span id="autosave-title" class="settings-label"></span>
          <small id="autosave-status"></small>
        </div>
      </div>
    </section>

    <section id="onboarding" class="full-screen-layer onboarding-layer" hidden>
      <div class="onboarding-brand">
        <span id="onboarding-seal" class="mini-seal"></span>
        <strong id="onboarding-title"></strong>
      </div>
      <div class="onboarding-copy">
        <small id="onboarding-step"></small>
        <p id="onboarding-story"></p>
        <p id="onboarding-line"></p>
        <span id="onboarding-tap"></span>
      </div>
      <div class="title-actions">
        <button id="title-new-seed" class="ghost-button" type="button"></button>
        <small id="title-diagnostics"></small>
      </div>
    </section>

    <section id="promise-modal" class="modal-layer" hidden>
      <div class="promise-card" role="dialog" aria-modal="true">
        <small id="promise-kicker"></small>
        <p id="promise-context" hidden></p>
        <h2 id="promise-question"></h2>
        <output id="promise-value" for="promise-slider"></output>
        <input id="promise-slider" type="range">
        <div class="promise-range"><span id="promise-min"></span><span id="promise-max"></span></div>
        <button id="promise-confirm" class="primary-button" type="button"></button>
      </div>
    </section>

    <button id="context-tooltip" type="button" hidden></button>

    <section id="road-event-modal" class="full-screen-layer road-event-layer" hidden>
      <article class="road-event-card" role="dialog" aria-modal="true">
        <small id="road-event-kicker"></small>
        <svg id="road-event-glyph" class="road-event-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use id="road-event-glyph-use" href="#road-event-glyph-omen"></use>
        </svg>
        <p id="road-event-text"></p>
        <div class="road-event-actions">
          <button id="road-event-choice-a" class="road-event-choice" type="button"></button>
          <button id="road-event-choice-b" class="road-event-choice" type="button"></button>
        </div>
      </article>
    </section>

    <section id="demo-ending" class="full-screen-layer ending-layer" hidden>
      <div class="ending-scroll">
        <div id="ending-seal" class="ending-seal"></div>
        <section class="ending-section">
          <h2 id="mirror-title"></h2>
          <div id="mirror-table" class="mirror-table"></div>
        </section>
        <section class="ending-section ending-chronicle-section">
          <h2 id="ending-chronicle-title"></h2>
          <ol id="ending-chronicle" class="ending-chronicle"></ol>
        </section>
        <section class="ending-section">
          <h2 id="ending-stats-title"></h2>
          <dl id="ending-stats" class="ending-stats"></dl>
        </section>
        <p id="ending-line" class="ending-line"></p>
        <div class="ending-actions">
          <button id="share-result" class="primary-button" type="button"></button>
          <button id="replay-button" class="ghost-button" type="button"></button>
        </div>
        <code id="result-code" class="result-code" data-number-budget-exempt></code>
      </div>
    </section>

    <small id="version-label" class="version-label"></small>
    <div id="fx-layer" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
