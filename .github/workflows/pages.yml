name: Deploy The Crown to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch, tag, or commit SHA to deploy (use rollback tag to revert Pages)
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp deployed commit
        run: |
          DEPLOY_SHA="$(git rev-parse --short=7 HEAD)"
          sed -i "s/BUILD_VERSION: \"[^\"]*\"/BUILD_VERSION: \"${DEPLOY_SHA}\"/" outputs/js/data.js

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
